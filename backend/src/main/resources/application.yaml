spring:
  application:
    name: quickcart-backend

  data:
    redis:
      url: ${REDIS_URL}
      connect-timeout: 5s
      timeout: 3s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - flyway
    default-schema: flyway
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

quickcart:
  auth:
    otp:
      expiry: 5m
      max-attempts: 5
      resend-cooldown: 60s
      digits: 6
      hmac-secret: ${OTP_HMAC_SECRET}
      delivery-mode: ${OTP_DELIVERY_MODE:disabled}

  inventory:
    reservation:
      expiry: 10m

  pagination:
    default-size: 20
    max-size: 100

